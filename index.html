<html lang="fr"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0b5cab"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Scanner codes-barres</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14212b;--mut:#5d6b76;--line:#d9e0e5;--acc:#0b5cab;--bad:#b3261e;--badbg:#fde8e6;--ok:#17653a;--okbg:#e2f4e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#1a242c;--ink:#e8eef2;--mut:#93a2ad;--line:#2d3b45;--acc:#6db1ff;--bad:#ff9a92;--badbg:#3a1f1d;--ok:#7fdca0;--okbg:#17321f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row:first-child{margin-top:0}
input,button,select{font:inherit;border-radius:8px;border:1px solid var(--line);padding:10px;background:var(--card);color:var(--ink);min-width:0}
input[type=text],input:not([type]){flex:1;width:100%}
button{cursor:pointer;font-weight:600}
button.p,.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root:not([data-theme="light"]) button.p,:root:not([data-theme="light"]) .chip.on{color:#06223f}
.chip{flex:1;padding:8px 6px;font-size:14px}
#reader{width:100%;margin-top:10px;display:none;border-radius:8px;overflow:hidden}
#msg{margin-top:10px;border-radius:8px;padding:12px;display:none}
#msg.bad{display:block;background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
#msg.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #0004;vertical-align:-2px;margin-right:6px}
#add,#imp{display:none;margin-top:10px}#add label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.meta{color:var(--mut);font-size:13px;margin:6px 2px}
.gh{margin:10px 0 4px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.gh span:last-child{font-weight:600;color:var(--mut);white-space:nowrap}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:7px;margin-bottom:4px;color:#14212b;background:#fff;border:1px solid var(--line)}
.item .n{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}.item .c{font-size:12px;opacity:.7}
.item .b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
#list{max-height:60vh;overflow-y:auto}.flash{outline:3px solid var(--acc)}
</style></head><body><main>
<h1>Scanner codes-barres <small style="font-size:12px;color:var(--mut)">v3</small></h1>
<div class="card">
 <div class="row"><input id="scan" inputmode="numeric" autocomplete="off" placeholder="Scannez ou tapez un code-barres" autofocus><button class="p" id="go">OK</button></div>
 <div class="row"><button id="cam" style="flex:1">Scanner avec la caméra</button></div>
 <div id="reader"></div><div id="msg" role="status"></div>
 <div id="add">
  <label for="nm">Nom de l'article</label><input id="nm" list="names" dir="auto" autocomplete="off"><datalist id="names"></datalist>
  <label for="cd">Code article (facultatif)</label><input id="cd" autocomplete="off">
  <div class="row"><button class="p" id="save" style="flex:1">Ajouter ce code-barres</button><button id="cancel">Annuler</button></div>
 </div>
</div>
<div class="card">
 <h2>Excel</h2>
 <div class="row"><button class="p" id="impb" style="flex:1">Importer un fichier Excel</button><button id="exp" style="flex:1">Exporter tout</button><button id="expf" style="flex:1">Exporter le filtre</button></div>
 <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
 <div id="imp"><div id="impt" class="meta"></div><div class="row"><button class="p" id="iadd" style="flex:1">Ajouter les nouveaux</button><button id="irep" style="flex:1">Remplacer la liste</button><button id="icn">Annuler</button></div></div>
 <div class="meta">Colonnes lues : Code Article, Libelle, Code à barre. Les ajouts sont gardés dans ce navigateur : exportez de temps en temps pour garder une copie.</div>
</div>
<div class="card">
 <h2>Filtrer</h2>
 <input id="q" dir="auto" placeholder="Mots de l'article ou code-barres (ex: cahier 96)">
 <div class="row"><button class="chip on" data-m="all">Tous</button><button class="chip" data-m="multi">Plusieurs codes</button><button class="chip" data-m="single">Un seul code</button></div>
 <div class="row"><select id="sort" style="flex:1"><option value="list">Ordre de la liste</option><option value="az">Nom A → Z</option><option value="cnt">Plus de codes d'abord</option></select><button id="grp">Grouper par article</button><button id="clr">Effacer</button></div>
 <div class="meta" id="count"></div><div id="list"></div>
</div>

const COLORS=['#FFF2CC','#DDEBF7','#E2EFDA','#FCE4D6','#E4DFEC','#D9D9D9','#FFD9E6','#D0F0F0','#F8CBAD','#C9E7A7'];
const KEY='barcodes_v1';
let items;try{const s=localStorage.getItem(KEY);items=s?JSON.parse(s):null}catch(e){items=null}
if(!items)items=SEED.map(r=>({c:r[0],n:r[1],b:r[2]}));
const $=id=>document.getElementById(id);
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
let mode='all',grouped=false,pending=null,shown=[];
function stats(){const cnt={},seen=[],col=[];items.forEach(i=>{const k=norm(i.n);cnt[k]=(cnt[k]||0)+1});const s={};
 items.forEach(i=>{const k=norm(i.n);s[k]=(s[k]||0)+1;col.push(cnt[k]>1?COLORS[(s[k]-1)%COLORS.length]:'#fff')});return{cnt,col}}
function rowHtml(i,col,flash){return `<div class="item${flash?' flash':''}" style="background:${col}"><div class="n" data-n="${esc(i.n)}"><span dir="auto">${esc(i.n)}</span><div class="c">${esc(i.c)}</div></div><div class="b">${esc(i.b)}</div></div>`}
function render(flashB){
  const {cnt,col}=stats(),words=norm($('q').value).split(/\s+/).filter(Boolean);
  let a=items.map((i,x)=>({i,x,k:norm(i.n),col:col[x]})).filter(r=>{
    const n=cnt[r.k];if(mode==='multi'&&n<2)return false;if(mode==='single'&&n!==1)return false;
    const h=r.k+' '+norm(r.i.b)+' '+norm(r.i.c);return words.every(w=>h.includes(w))});
  const so=$('sort').value;
  if(so==='az')a.sort((p,q)=>p.k.localeCompare(q.k)||p.x-q.x);
  if(so==='cnt')a.sort((p,q)=>cnt[q.k]-cnt[p.k]||p.k.localeCompare(q.k)||p.x-q.x);
  shown=a.map(r=>r.i);let h='';
  if(grouped){const g=new Map();a.forEach(r=>{if(!g.has(r.k))g.set(r.k,[]);g.get(r.k).push(r)});
   g.forEach(rs=>{h+=`<div class="gh"><span dir="auto">${esc(rs[0].i.n)}</span><span>${rs.length} code(s)</span></div>`+rs.map(r=>rowHtml(r.i,r.col,String(r.i.b)===flashB)).join('')})}
  else h=a.map(r=>rowHtml(r.i,r.col,String(r.i.b)===flashB)).join('');
  $('list').innerHTML=h||'<div class="meta">Aucun résultat.</div>';
  $('count').textContent=a.length+' ligne(s) sur '+items.length+' · '+new Set(a.map(r=>r.k)).size+' article(s)';
  $('names').innerHTML=[...new Set(items.map(i=>i.n))].map(v=>`<option value="${esc(v)}">`).join('');
}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render()});
$('grp').onclick=()=>{grouped=!grouped;$('grp').classList.toggle('p',grouped);render()};
$('clr').onclick=()=>{$('q').value='';mode='all';$('sort').value='list';document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m==='all'));render()};
$('sort').onchange=()=>render();$('q').addEventListener('input',()=>render());
$('list').onclick=e=>{const n=e.target.closest('.n');if(n){$('q').value=n.dataset.n;render();window.scrollTo({top:0,behavior:'smooth'})}};
function say(c,h){const m=$('msg');m.className=c;m.innerHTML=h}
function handle(code){
  code=String(code).trim();if(!code)return;const x=items.findIndex(i=>String(i.b)===code);$('add').style.display='none';
  if(x>=0){const i=items[x],c=stats().col[x];
    say('bad',`<b>Déjà dans la liste</b><br>${esc(code)}<br><span class="sw" style="background:${c}"></span><span dir="auto">${esc(i.n)}</span> (code article ${esc(i.c)})`);
    $('q').value='';render(code);const f=document.querySelector('.flash');if(f)f.scrollIntoView({block:'center'});
    if(navigator.vibrate)navigator.vibrate([200,100,200]);
  }else{pending=code;say('ok',`<b>Nouveau code-barres</b><br>${esc(code)}<br>Indiquez l'article pour l'ajouter.`);
    $('nm').value='';$('cd').value='';$('add').style.display='block';$('nm').focus()}
  $('scan').value='';
}
$('nm').addEventListener('input',()=>{const m=items.find(i=>norm(i.n)===norm($('nm').value));if(m)$('cd').value=m.c});
$('save').onclick=()=>{const n=$('nm').value.trim();if(!n){$('nm').focus();return}
  items.push({c:$('cd').value.trim(),n:n,b:pending});save();const cm=stats().col;
  say('ok',`<b>Ajouté</b><br>${esc(pending)}<br><span class="sw" style="background:${cm[cm.length-1]}"></span><span dir="auto">${esc(n)}</span>`);
  $('add').style.display='none';$('q').value='';render(pending);pending=null;$('scan').focus()};
$('cancel').onclick=()=>{$('add').style.display='none';$('msg').className='';pending=null};
$('go').onclick=()=>handle($('scan').value);
$('scan').addEventListener('keydown',e=>{if(e.key==='Enter')handle($('scan').value)});
/* Excel export */
function exportRows(list,name){
  if(typeof XLSX==='undefined'){say('bad',"La bibliothèque Excel n'est pas chargée (internet requis la 1re fois).");return}
  const cnt={};items.forEach(i=>{const k=norm(i.n);cnt[k]=(cnt[k]||0)+1});
  const ws=XLSX.utils.aoa_to_sheet([['Code Article','Libelle','Code à barre','Nb codes']].concat(list.map(i=>[i.c,i.n,String(i.b),cnt[norm(i.n)]])));
  ws['!cols']=[{wch:14},{wch:50},{wch:18},{wch:10}];ws['!autofilter']={ref:'A1:D'+(list.length+1)};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Liste');XLSX.writeFile(wb,name)}
$('exp').onclick=()=>exportRows(items,'ListeCodeBarre.xlsx');
$('expf').onclick=()=>exportRows(shown,'ListeCodeBarre_filtre.xlsx');
/* Excel import */
let imported=[];
$('impb').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(typeof XLSX==='undefined'){say('bad',"La bibliothèque Excel n'est pas chargée (internet requis la 1re fois).");return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
    let hr=-1,cN=1,cB=2,cC=0;
    for(let r=0;r<Math.min(rows.length,20);r++){const t=rows[r].map(v=>String(v));
      const n=t.findIndex(v=>/lib|d[eé]sign|nom/i.test(v)),b=t.findIndex(v=>/barre|ean|barcode|gtin/i.test(v));
      if(n>=0&&b>=0){hr=r;cN=n;cB=b;const c=t.findIndex((v,i)=>i!==b&&i!==n&&/code|r[eé]f/i.test(v));cC=c>=0?c:-1;break}}
    imported=[];
    rows.slice(hr+1).forEach(r=>{const n=String(r[cN]||'').trim(),b=String(r[cB]||'').trim();
      if(!n||!b||/barre|ean|barcode/i.test(b))return;imported.push({c:cC>=0?String(r[cC]||'').trim():'',n:n,b:b})});
    const have=new Set(items.map(i=>String(i.b))),nw=imported.filter(i=>!have.has(i.b)).length;
    $('impt').textContent=f.name+' : '+imported.length+' ligne(s) lues, '+nw+' nouveau(x), '+(imported.length-nw)+' déjà présent(s).';
    $('imp').style.display=imported.length?'block':'none';
    if(!imported.length)say('bad','Aucune ligne reconnue. Vérifiez les titres : Libelle et Code à barre.');
  }catch(err){say('bad',"Impossible de lire ce fichier.")}
};
$('iadd').onclick=()=>{const have=new Set(items.map(i=>String(i.b)));let n=0;
  imported.forEach(i=>{if(!have.has(i.b)){have.add(i.b);items.push(i);n++}});save();$('imp').style.display='none';say('ok',`<b>${n} article(s) ajouté(s)</b>`);render()};
$('irep').onclick=()=>{if(!confirm('Remplacer toute la liste actuelle ?'))return;const s=new Set();items=imported.filter(i=>!s.has(i.b)&&s.add(i.b));save();$('imp').style.display='none';say('ok',`<b>Liste remplacée : ${items.length} lignes</b>`);render()};
$('icn').onclick=()=>{$('imp').style.display='none'};
/* camera */
let sc=null,on=false,last=0;
$('cam').onclick=async()=>{const r=$('reader');
  if(on){try{await sc.stop()}catch(e){}r.style.display='none';on=false;$('cam').textContent='Scanner avec la caméra';return}
  if(typeof Html5Qrcode==='undefined'){say('bad',"Le lecteur caméra n'a pas pu se charger. Utilisez un scanner ou tapez le code.");return}
  r.style.display='block';$('cam').textContent='Arrêter la caméra';on=true;
  try{const F=Html5QrcodeSupportedFormats;
    sc=sc||new Html5Qrcode('reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39],useBarCodeDetectorIfSupported:true});
    await sc.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:120}},t=>{const now=Date.now();if(now-last<2500)return;last=now;handle(t)},()=>{});
  }catch(e){r.style.display='none';on=false;$('cam').textContent='Scanner avec la caméra';say('bad','Caméra inaccessible. Autorisez la caméra dans le navigateur.')}};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
