<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0b5cab"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Scanner codes-barres</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14212b;--mut:#5d6b76;--line:#d9e0e5;--acc:#0b5cab;--bad:#b3261e;--badbg:#fde8e6;--ok:#17653a;--okbg:#e2f4e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#1a242c;--ink:#e8eef2;--mut:#93a2ad;--line:#2d3b45;--acc:#6db1ff;--bad:#ff9a92;--badbg:#3a1f1d;--ok:#7fdca0;--okbg:#17321f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row:first-child{margin-top:0}
input,button,select{font:inherit;border-radius:8px;border:1px solid var(--line);padding:10px;background:var(--card);color:var(--ink);min-width:0}
input[type=text],input:not([type]){flex:1;width:100%}
button{cursor:pointer;font-weight:600}
button.p,.chip.on,.tb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root:not([data-theme="light"]) button.p,:root:not([data-theme="light"]) .chip.on,:root:not([data-theme="light"]) .tb.on{color:#06223f}
.chip,.tb{flex:1;padding:8px 6px;font-size:14px}
#reader{width:100%;margin-top:10px;display:none;border-radius:8px;overflow:hidden}
#msg{margin-top:10px;border-radius:8px;padding:12px;display:none}
#msg.bad{display:block;background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
#msg.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #0004;vertical-align:-2px;margin-right:6px}
#add,#imp{display:none;margin-top:10px}#add label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.meta{color:var(--mut);font-size:13px;margin:6px 2px}
.gh{margin:10px 0 4px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.gh span:last-child{font-weight:600;color:var(--mut);white-space:nowrap}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:7px;margin-bottom:4px;color:#14212b;background:#fff;border:1px solid var(--line)}
.item .n{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}.item .c{font-size:12px;opacity:.7}
.item .b{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
#list{max-height:60vh;overflow-y:auto}.dup{background:#b3261e;color:#fff;border-radius:4px;padding:0 5px;font-size:12px;margin-left:4px}.warn{background:var(--badbg);color:var(--bad);border:1px solid var(--bad);border-radius:8px;padding:10px;margin-top:10px;display:none}.lb{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}.act{display:flex;gap:4px;align-items:flex-start}.act button{padding:3px 8px;font-size:15px;background:#fff;color:#14212b;border:1px solid var(--line)}#ed{display:none;position:fixed;inset:0;background:#0009;z-index:10;padding:14px;overflow:auto}.rl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:7px;margin-top:4px;color:#14212b;border:1px solid var(--line)}.rl input{width:22px;height:22px;flex:none;padding:0}.flash{outline:3px solid var(--acc)}
</style></head><body><main>
<h1>Scanner codes-barres <small style="font-size:12px;color:var(--mut)">v8</small></h1>
<div class="card">
 <div class="row"><input id="scan" inputmode="numeric" autocomplete="off" placeholder="Scannez ou tapez un code-barres" autofocus><button class="p" id="go">OK</button></div>
 <div class="row"><button id="cam" style="flex:1">Scanner avec la caméra</button></div>
 <div id="reader"></div><div id="msg" role="status"></div>
 <div id="rs" style="display:none;margin-top:10px"><div id="rst"></div><div id="rsl"></div><div id="rse" class="meta" style="color:var(--bad)"></div><div class="row"><button class="p" id="rsok" style="flex:1">Garder la sélection, le reste à la corbeille</button><button id="rsno">Annuler</button></div></div>
 <div id="add">
  <label for="nm">Nom de l'article</label><input id="nm" list="names" dir="auto" autocomplete="off"><datalist id="names"></datalist>
  <label for="cd">Code article (facultatif : numéro automatique si vide)</label><input id="cd" autocomplete="off">
  <div class="warn" id="nw"><div id="nwt"></div><div class="row"><button class="p" id="nwy" style="flex:1">Ajouter quand même</button><button id="nwn" style="flex:1">Changer le nom</button></div></div>
  <div class="row"><button class="p" id="save" style="flex:1">Ajouter ce code-barres</button><button id="cancel">Annuler</button></div>
 </div>
</div>
<div class="card">
 <h2>Excel</h2>
 <div class="row"><button class="p" id="impb" style="flex:1">Importer un fichier Excel</button><button id="tpl" style="flex:1">Télécharger le modèle</button><button id="exp" style="flex:1">Exporter cette liste</button><button id="expf" style="flex:1">Exporter le filtre</button><button id="expfin" style="flex:1">Liste finale (gardés + non traités)</button></div>
 <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
 <div id="imp"><div id="impt" class="meta"></div><div class="row"><button class="p" id="iadd" style="flex:1">Ajouter les nouveaux</button><button id="irep" style="flex:1">Remplacer la liste</button><button id="icn">Annuler</button></div></div>
 <div class="meta">Colonnes lues : Code Article, Libelle, Code à barre. Les ajouts sont gardés dans ce navigateur : exportez de temps en temps pour garder une copie.</div>
</div>
<div class="card">
 <div class="row"><button class="tb on" data-t="s" id="t_s">Départ</button><button class="tb" data-t="k" id="t_k">Gardés</button><button class="tb" data-t="b" id="t_b">Corbeille</button></div>
 <h2 style="margin-top:12px">Filtrer</h2>
 <input id="q" dir="auto" placeholder="Mots de l'article ou code-barres (ex: cahier 96)">
 <div class="row"><button class="chip on" data-m="all">Tous</button><button class="chip" data-m="multi">Plusieurs codes</button><button class="chip" data-m="single">Un seul code</button><button class="chip" data-m="dup">Codes en double</button></div>
 <div class="row"><select id="sort" style="flex:1"><option value="list">Ordre de la liste</option><option value="az">Nom A → Z</option><option value="cnt">Plus de codes d'abord</option></select><button id="grp">Grouper par article</button><button id="clr">Effacer</button></div>
 <div class="meta" id="count"></div><div id="list"></div>
</div>
<div id="ed"><div class="card" style="max-width:480px;margin:20px auto">
 <h2>Modifier l'article</h2>
 <label class="lb" for="en">Nom de l'article</label><input id="en" dir="auto" autocomplete="off">
 <label class="lb" for="ec">Code article</label><input id="ec" autocomplete="off">
 <label class="lb" for="eb">Code-barres</label><input id="eb" autocomplete="off">
 <label class="lb" style="display:none;margin-top:12px" id="eallw"><input type="checkbox" id="eall"> Appliquer le nom et le code à toutes les lignes de cet article (<span id="ecnt"></span>)</label>
 <div id="eerr" class="meta" style="color:var(--bad)"></div>
 <div class="row"><button class="p" id="esv" style="flex:1">Enregistrer</button><button id="ecn" style="flex:1">Annuler</button></div>
 <div class="row"><button id="edl" style="flex:1;color:var(--bad)">Supprimer cette ligne</button><button id="eda" style="flex:1;color:var(--bad)">Supprimer tout l'article</button></div>
</div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SEED=[];
const COLORS=['#FFF2CC','#DDEBF7','#E2EFDA','#FCE4D6','#E4DFEC','#D9D9D9','#FFD9E6','#D0F0F0','#F8CBAD','#C9E7A7'];
const KEY='barcodes_v1';
let items;try{const s=localStorage.getItem(KEY);items=s?JSON.parse(s):null}catch(e){items=null}
if(!items)items=SEED.map(r=>({c:r[0],n:r[1],b:r[2],st:'s'}));
items.forEach(i=>{if(!i.st)i.st='s'});
let tab='s';
const $=id=>document.getElementById(id);
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}};
let mode='all',grouped=false,pending=null,shown=[];
function stats(){const cnt={},seen=[],col=[];items.forEach(i=>{const k=i.st+'|'+norm(i.n);cnt[k]=(cnt[k]||0)+1});const s={};
 items.forEach(i=>{const k=i.st+'|'+norm(i.n);s[k]=(s[k]||0)+1;col.push(cnt[k]>1?COLORS[(s[k]-1)%COLORS.length]:'#fff')});const bc={};items.forEach(i=>{const b=i.st+'|'+String(i.b);bc[b]=(bc[b]||0)+1});return{cnt,col,bc}}
function rowHtml(i,col,flash,bn){return `<div class="item${flash?' flash':''}" style="background:${col}"><div class="n" data-n="${esc(i.n)}"><span dir="auto">${esc(i.n)}</span><div class="c">${esc(i.c)}</div></div><div class="b">${esc(i.b)}${bn>1?` <span class="dup">×${bn}</span>`:''}</div><div class="act">${i.st==='s'?`<button class="rv" data-x="${items.indexOf(i)}" title="Trier cet article">✔</button>`:`<button class="bk" data-x="${items.indexOf(i)}" title="Remettre dans le départ">↩</button>`}<button class="ed" data-x="${items.indexOf(i)}" title="Modifier">✎</button><button class="del" data-x="${items.indexOf(i)}" title="Supprimer">🗑</button></div></div>`}
function render(flashB){
  const {cnt,col,bc}=stats(),words=norm($('q').value).split(/\s+/).filter(Boolean);
  let a=items.map((i,x)=>({i,x,k:i.st+'|'+norm(i.n),nk:norm(i.n),col:col[x],bn:bc[i.st+'|'+String(i.b)]})).filter(r=>r.i.st===tab).filter(r=>{
    const n=cnt[r.k];if(mode==='multi'&&n<2)return false;if(mode==='single'&&n!==1)return false;if(mode==='dup'&&r.bn<2)return false;
    const h=r.nk+' '+norm(r.i.b)+' '+norm(r.i.c);return words.every(w=>h.includes(w))});
  const so=$('sort').value;
  if(so==='az')a.sort((p,q)=>p.k.localeCompare(q.k)||p.x-q.x);
  if(so==='cnt')a.sort((p,q)=>cnt[q.k]-cnt[p.k]||p.k.localeCompare(q.k)||p.x-q.x);
  shown=a.map(r=>r.i);let h='';
  if(grouped){const g=new Map();a.forEach(r=>{if(!g.has(r.k))g.set(r.k,[]);g.get(r.k).push(r)});
   g.forEach(rs=>{h+=`<div class="gh"><span dir="auto">${esc(rs[0].i.n)}</span><span>${rs.length} code(s)</span></div>`+rs.map(r=>rowHtml(r.i,r.col,String(r.i.b)===flashB,r.bn)).join('')})}
  else h=a.map(r=>rowHtml(r.i,r.col,String(r.i.b)===flashB,r.bn)).join('');
  $('list').innerHTML=h||'<div class="meta">Aucun résultat. Importez un fichier Excel (ou téléchargez le modèle).</div>';
  ['s','k','b'].forEach(z=>{$('t_'+z).textContent={s:'Départ',k:'Gardés',b:'Corbeille'}[z]+' ('+items.filter(i=>i.st===z).length+')'});
  $('count').textContent=a.length+' ligne(s) sur '+items.filter(i=>i.st===tab).length+' · '+new Set(a.map(r=>r.k)).size+' article(s)';
  $('names').innerHTML=[...new Set(items.map(i=>i.n))].map(v=>`<option value="${esc(v)}">`).join('');
}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));render()});
$('grp').onclick=()=>{grouped=!grouped;$('grp').classList.toggle('p',grouped);render()};
$('clr').onclick=()=>{$('q').value='';mode='all';$('sort').value='list';document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m==='all'));render()};
$('sort').onchange=()=>render();$('q').addEventListener('input',()=>render());
$('list').onclick=e=>{const ed=e.target.closest('.ed'),dl=e.target.closest('.del');const rv=e.target.closest('.rv'),bk=e.target.closest('.bk');if(rv){openRs(+rv.dataset.x);return}if(bk){items[+bk.dataset.x].st='s';save();say('ok','<b>Remis dans la liste de départ</b>');render();return}if(ed){openEd(+ed.dataset.x);return}if(dl){delLine(+dl.dataset.x);return}const n=e.target.closest('.n');if(n){$('q').value=n.dataset.n;render();window.scrollTo({top:0,behavior:'smooth'})}};
function say(c,h){const m=$('msg');m.className=c;m.innerHTML=h}
const gkey=i=>String(i.c).trim()?'c:'+String(i.c).trim():'n:'+norm(i.n);
function setTab(z){tab=z;document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t===z));render()}
document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
let rsGroup=[];
function openRs(x){const it=items[x],k=gkey(it);$('add').style.display='none';$('rse').textContent='';
  const g=[];items.forEach((r,j)=>{if(r.st==='s'&&gkey(r)===k)g.push(j)});rsGroup=g;const col=stats().col;
  $('rst').innerHTML=`<b dir="auto">${esc(it.n)}</b><br>Code article ${esc(it.c)||'(vide)'} · ${g.length} ligne(s). Cochez celle(s) à garder : les autres iront à la corbeille.`;
  $('rsl').innerHTML=g.map(j=>`<label class="rl" style="background:${col[j]}"><input type="checkbox" data-j="${j}" ${j===x?'checked':''}> <span dir="auto">${esc(items[j].n)}</span> <b>${esc(items[j].b)}</b>${j===x?' <em>(scanné)</em>':''}</label>`).join('');
  $('rs').style.display='block';$('rs').scrollIntoView({block:'center'})}
$('rsok').onclick=()=>{const sel=[...document.querySelectorAll('#rsl input:checked')].map(c=>+c.dataset.j);
  if(!sel.length){$('rse').textContent='Cochez au moins une ligne à garder.';return}
  rsGroup.forEach(j=>{items[j].st=sel.includes(j)?'k':'b'});save();$('rs').style.display='none';
  say('ok',`<b>${sel.length} gardé(s), ${rsGroup.length-sel.length} envoyé(s) à la corbeille</b>`);render();$('scan').focus()};
$('rsno').onclick=()=>{$('rs').style.display='none';$('msg').className=''};
function handle(code){code=String(code).trim();if(!code)return;$('add').style.display='none';$('rs').style.display='none';
  const f=items.findIndex(i=>String(i.b)===code&&i.st==='s');
  if(f>=0){say('ok',`<b>${esc(code)}</b> trouvé dans la liste de départ`);openRs(f)}
  else{const o=items.findIndex(i=>String(i.b)===code);
    if(o>=0){const i=items[o];say('bad',`<b>Déjà traité</b><br>${esc(code)} est dans ${i.st==='k'?'les Gardés':'la Corbeille'}<br><span dir="auto">${esc(i.n)}</span><div class="row"><button class="p" id="rst2" style="flex:1">Remettre dans le départ</button></div>`);
      $('rst2').onclick=()=>{i.st='s';save();render();handle(code)};if(navigator.vibrate)navigator.vibrate([200,100,200])}
    else{pending=code;say('bad',`<b>Introuvable</b><br>${esc(code)} n'est dans aucune liste. Indiquez l'article pour l'ajouter au départ.`);openAdd('','');$('nm').focus()}}
  $('scan').value=''}
let fromName=false;
$('nm').addEventListener('input',()=>{nameOk=false;$('nw').style.display='none';const m=items.find(i=>norm(i.n)===norm($('nm').value));if(m){$('cd').value=m.c;fromName=true}else if(fromName){$('cd').value='';fromName=false}});
const nextCode=()=>{let m=0,f=false;items.forEach(i=>{const c=String(i.c).trim();if(/^\d+$/.test(c)){m=Math.max(m,Number(c));f=true}});return f?String(m+1):''};
let okName='',nameOk=false;
function openAdd(name,code){okName=norm(name);nameOk=false;fromName=false;$('nw').style.display='none';$('nm').value=name;$('cd').value=code;$('cd').placeholder='Auto : '+nextCode();$('add').style.display='block'}
function doSave(){const n=$('nm').value.trim(),m=items.find(i=>norm(i.n)===norm(n));
  const code=$('cd').value.trim()||(m&&m.c)||nextCode();
  items.push({c:code,n:n,b:pending,st:'s'});save();tab='s';document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t==='s'));const cm=stats().col;
  say('ok',`<b>Ajouté</b><br>${esc(pending)} · code article ${esc(code)}<br><span class="sw" style="background:${cm[cm.length-1]}"></span><span dir="auto">${esc(n)}</span>`);
  $('add').style.display='none';$('nw').style.display='none';$('q').value='';render(pending);pending=null;$('scan').focus()}
$('save').onclick=()=>{const n=$('nm').value.trim();if(!n){$('nm').focus();return}
  const g=items.filter(i=>norm(i.n)===norm(n));
  if(g.length&&norm(n)!==okName&&!nameOk){$('nwt').innerHTML=`<b>Cet article existe déjà</b> (${g.length} code(s)-barres : ${g.slice(0,4).map(i=>esc(i.b)).join(', ')}${g.length>4?'…':''}). Ajouter ce code-barres quand même ?`;$('nw').style.display='block';$('nw').scrollIntoView({block:'center'});return}
  doSave()};
$('nwy').onclick=()=>{nameOk=true;doSave()};
$('nwn').onclick=()=>{$('nw').style.display='none';$('nm').focus();$('nm').select()};
$('cancel').onclick=()=>{$('add').style.display='none';$('nw').style.display='none';$('msg').className='';pending=null};
$('go').onclick=()=>handle($('scan').value);
$('scan').addEventListener('keydown',e=>{if(e.key==='Enter')handle($('scan').value)});
/* Excel export */
function exportRows(list,name){
  if(typeof XLSX==='undefined'){say('bad',"La bibliothèque Excel n'est pas chargée (internet requis la 1re fois).");return}
  const cnt={};list.forEach(i=>{const k=norm(i.n);cnt[k]=(cnt[k]||0)+1});
  const ws=XLSX.utils.aoa_to_sheet([['Code Article','Libelle','Code à barre','Nb codes']].concat(list.map(i=>[i.c,i.n,String(i.b),cnt[norm(i.n)]])));
  ws['!cols']=[{wch:14},{wch:50},{wch:18},{wch:10}];ws['!autofilter']={ref:'A1:D'+(list.length+1)};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Liste');XLSX.writeFile(wb,name)}
$('exp').onclick=()=>exportRows(items.filter(i=>i.st===tab),{s:'Depart',k:'Gardes',b:'Corbeille'}[tab]+'.xlsx');
$('expfin').onclick=()=>exportRows(items.filter(i=>i.st!=='b'),'ListeFinale.xlsx');
$('expf').onclick=()=>exportRows(shown,'Filtre.xlsx');
/* Excel template */
$('tpl').onclick=()=>{const head=['Code Article','Libelle','Code à barre'];
  if(typeof XLSX==='undefined'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+head.join(';')+'\n'],{type:'text/csv'}));a.download='Modele.csv';a.click();return}
  const ws=XLSX.utils.aoa_to_sheet([head]);ws['!cols']=[{wch:14},{wch:50},{wch:18}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Liste');XLSX.writeFile(wb,'Modele.xlsx');say('ok','<b>Modèle téléchargé</b><br>Remplissez-le puis cliquez sur « Importer un fichier Excel ».')};
/* Excel import */
let imported=[];
$('impb').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(typeof XLSX==='undefined'){say('bad',"La bibliothèque Excel n'est pas chargée (internet requis la 1re fois).");return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
    let hr=-1,cN=1,cB=2,cC=0;
    for(let r=0;r<Math.min(rows.length,20);r++){const t=rows[r].map(v=>String(v));
      const n=t.findIndex(v=>/lib|d[eé]sign|nom/i.test(v)),b=t.findIndex(v=>/barre|ean|barcode|gtin/i.test(v));
      if(n>=0&&b>=0){hr=r;cN=n;cB=b;const c=t.findIndex((v,i)=>i!==b&&i!==n&&/code|r[eé]f/i.test(v));cC=c>=0?c:-1;break}}
    imported=[];
    rows.slice(hr+1).forEach(r=>{const n=String(r[cN]||'').trim(),b=String(r[cB]||'').trim();
      if(!n||!b||/barre|ean|barcode/i.test(b))return;imported.push({c:cC>=0?String(r[cC]||'').trim():'',n:n,b:b,st:'s'})});
    const have=new Set(items.map(i=>String(i.b))),nw=imported.filter(i=>!have.has(i.b)).length;
    $('impt').textContent=f.name+' : '+imported.length+' ligne(s) lues, '+nw+' nouveau(x), '+(imported.length-nw)+' déjà présent(s).';
    $('imp').style.display=imported.length?'block':'none';
    if(!imported.length)say('bad','Aucune ligne reconnue. Vérifiez les titres : Libelle et Code à barre.');
  }catch(err){say('bad',"Impossible de lire ce fichier.")}
};
$('iadd').onclick=()=>{const have=new Set(items.map(i=>String(i.b)));let n=0;
  imported.forEach(i=>{if(!have.has(i.b)){have.add(i.b);items.push(i);n++}});save();$('imp').style.display='none';say('ok',`<b>${n} article(s) ajouté(s)</b>`);render()};
$('irep').onclick=()=>{if(!confirm('Remplacer TOUTES les listes (départ, gardés, corbeille) par ce fichier ?'))return;const s=new Set();items=imported.filter(i=>{const k=i.b+'|'+norm(i.n);return !s.has(k)&&s.add(k)});save();$('imp').style.display='none';say('ok',`<b>Liste remplacée : ${items.length} lignes</b>`);render()};
$('icn').onclick=()=>{$('imp').style.display='none'};
/* edit / delete */
let ex=-1;
const artCount=i=>items.filter(r=>r.st===i.st&&norm(r.n)===norm(i.n)).length;
function openEd(x){ex=x;const i=items[x],c=artCount(i);$('en').value=i.n;$('ec').value=i.c;$('eb').value=i.b;$('ecnt').textContent=c+' lignes';$('eall').checked=c>1;$('eallw').style.display=c>1?'block':'none';$('eerr').textContent='';$('ed').style.display='block';$('en').focus()}
function closeEd(){$('ed').style.display='none';ex=-1}
function delLine(x){const i=items[x];if(!confirm('Supprimer cette ligne ?\n'+i.n+'\n'+i.b))return;items.splice(x,1);save();closeEd();say('ok','<b>Ligne supprimée</b>');render()}
$('esv').onclick=()=>{const n=$('en').value.trim(),c=$('ec').value.trim(),b=$('eb').value.trim();
  if(!n||!b){$('eerr').textContent='Le nom et le code-barres sont obligatoires.';return}
  if(items.some((r,k)=>k!==ex&&String(r.b)===b)&&!confirm('Ce code-barres existe déjà dans la liste. Continuer ?'))return;
  const old=norm(items[ex].n);
  if($('eall').checked&&artCount(items[ex])>1)items.forEach(r=>{if(r.st===items[ex].st&&norm(r.n)===old){r.n=n;r.c=c}});
  items[ex]={c:c,n:n,b:b,st:items[ex].st};save();closeEd();say('ok','<b>Modifié</b>');render()};
$('ecn').onclick=closeEd;
$('edl').onclick=()=>delLine(ex);
$('eda').onclick=()=>{const k=norm(items[ex].n),sx=items[ex].st,c=artCount(items[ex]);if(!confirm("Supprimer tout l'article et ses "+c+' ligne(s) ?\n'+items[ex].n))return;items=items.filter(r=>!(r.st===sx&&norm(r.n)===k));save();closeEd();say('ok','<b>Article supprimé</b> ('+c+' ligne(s))');render()};
$('ed').addEventListener('click',e=>{if(e.target.id==='ed')closeEd()});
/* camera */
let sc=null,on=false,last=0;
$('cam').onclick=async()=>{const r=$('reader');
  if(on){try{await sc.stop()}catch(e){}r.style.display='none';on=false;$('cam').textContent='Scanner avec la caméra';return}
  if(typeof Html5Qrcode==='undefined'){say('bad',"Le lecteur caméra n'a pas pu se charger. Utilisez un scanner ou tapez le code.");return}
  r.style.display='block';$('cam').textContent='Arrêter la caméra';on=true;
  try{const F=Html5QrcodeSupportedFormats;
    sc=sc||new Html5Qrcode('reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39],useBarCodeDetectorIfSupported:true});
    await sc.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:120}},t=>{const now=Date.now();if(now-last<2500)return;last=now;handle(t)},()=>{});
  }catch(e){r.style.display='none';on=false;$('cam').textContent='Scanner avec la caméra';say('bad','Caméra inaccessible. Autorisez la caméra dans le navigateur.')}};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
